<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caro & Ric - Ruleta Diaria</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            color: #e2e8f0;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 0;
            font-size: 0.95rem;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ef4444;
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.15, 0.99);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .result-card {
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .result-card h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .result-card p {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0;
        }

        .copy-btn {
            background-color: var(--success);
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .copy-btn:hover {
            background-color: var(--success-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Caro & Ric</h1>
    <p class="subtitle">Gira la ruleta</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <button id="spinBtn" onclick="spin()">¡Girar Ruleta!</button>

    <div id="resultCard" class="result-card">
        <h2>Pregunta seleccionada:</h2>
        <p id="questionDisplay"></p>
        <button class="copy-btn" onclick="copyQuestion()">Copiar pregunta</button>
    </div>
</div>

<script>
    const allQuestions = [
        "¿Qué te hizo sonreír hoy?",
        "¿Qué desafío superaste esta semana?",
        "¿Qué pequeño detalle aprecias más el día de hoy?",
        "¿Por qué estás agradecido hoy?",
        "¿Qué puedes hacer mañana para mejorar?",
        "¿Cuál ha sido tu mejor recuerdo juntos este mes?",
        "Comparte una meta que te ilusione mucho ahora mismo."
    ];

    const colors = ["#4f46e5", "#06b6d4", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6", "#3b82f6"];
    let currentAngle = 0;
    let activeQuestions = [];

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultCard = document.getElementById('resultCard');
    const questionDisplay = document.getElementById('questionDisplay');

    function init() {
        loadAvailableQuestions();
        drawWheel();
    }

    function loadAvailableQuestions() {
        let used = JSON.parse(localStorage.getItem('used_questions') || '[]');
        
        activeQuestions = allQuestions.filter(q => !used.includes(q));

        // Si ya se usaron todas, reiniciamos el ciclo automáticamente
        if (activeQuestions.length === 0) {
            localStorage.removeItem('used_questions');
            activeQuestions = [...allQuestions];
        }
    }

    function drawWheel() {
        const numOptions = activeQuestions.length;
        if (numOptions === 0) return;

        const arcSize = (2 * Math.PI) / numOptions;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numOptions; i++) {
            const angle = i * arcSize;
            
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, angle, angle + arcSize);
            ctx.lineTo(radius, radius);
            ctx.fill();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 11px sans-serif";

            let text = activeQuestions[i];
            if (text.length > 18) text = text.substring(0, 16) + '...';

            ctx.fillText(text, radius - 15, 4);
            ctx.restore();
        }
    }

    function spin() {
        if (activeQuestions.length === 0) {
            loadAvailableQuestions();
        }

        spinBtn.disabled = true;

        const numOptions = activeQuestions.length;
        const selectedIndex = Math.floor(Math.random() * numOptions);
        const selectedQuestion = activeQuestions[selectedIndex];
        
        const arcSize = 360 / numOptions;
        const targetAngle = 360 - (selectedIndex * arcSize) - (arcSize / 2) - 90; 
        const extraRotations = 5 * 360; 
        
        currentAngle += extraRotations + (targetAngle - (currentAngle % 360));

        canvas.style.transform = `rotate(${currentAngle}deg)`;

        setTimeout(() => {
            questionDisplay.textContent = selectedQuestion;
            resultCard.style.display = 'flex';

            // Guardamos esta pregunta en la lista de usadas para que no vuelva a aparecer
            let used = JSON.parse(localStorage.getItem('used_questions') || '[]');
            used.push(selectedQuestion);
            localStorage.setItem('used_questions', JSON.stringify(used));

            // Recargamos la lista activa y redibujamos la ruleta sin la pregunta seleccionada
            loadAvailableQuestions();
            drawWheel();
            
            spinBtn.disabled = false;
        }, 4000);
    }

    function copyQuestion() {
        const textToCopy = questionDisplay.textContent;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.textContent = "¡Copiado!";
            setTimeout(() => {
                copyBtn.textContent = "Copiar pregunta";
            }, 2000);
        }).catch(err => {
            console.error('Error al copiar: ', err);
        });
    }

    init();
</script>

</body>
</html>
